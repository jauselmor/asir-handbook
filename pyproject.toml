[project]
name = "par-handbook"
version = "0.1.0"
description = "Material del módulo 0370 (PAR) del CFGS ASIR — sitio MkDocs bilingüe con backend docente."
requires-python = ">=3.13"
dependencies = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-minify-plugin>=0.8",
    "mike>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
ingest = [
    "markitdown>=0.0.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
]
