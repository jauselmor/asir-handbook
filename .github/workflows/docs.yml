name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git-revision-date and mike both need full history

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Compliance gate: no publishing without complete, reviewed Spanish.
      - name: Check translations
        run: uv run scripts/check_translations.py

      - name: Build
        run: uv run mkdocs build --strict

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Rolling deploy of the current academic year. Bump CURSO each September;
      # previous years stay frozen and reachable via the version selector.
      - name: Deploy with mike
        env:
          CURSO: "2025-26"
        run: uv run mike deploy --push --update-aliases "$CURSO" latest
