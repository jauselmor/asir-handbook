name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      # Las mismas comprobaciones que init.sh, por separado, para que el log
      # diga exactamente cuál ha fallado.
      - name: Trazabilidad del currículo
        run: uv run scripts/check_curriculum.py
      - name: Estructura de las páginas
        run: uv run scripts/check_structure.py
      - name: Traducciones
        run: uv run scripts/check_translations.py
      - name: Backend docente
        run: uv run scripts/check_teacher.py
      - name: Fuentes normativas
        run: uv run scripts/check_sources.py
      - name: Build
        run: uv run mkdocs build --strict

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Configurar git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Publicar con mike
        run: uv run mike deploy --push --update-aliases 2026-27 latest
