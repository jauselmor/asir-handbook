site_name: PAR — Network Planning and Administration
site_description: Módulo 0370 · CFGS Administración de Sistemas Informáticos en Red
docs_dir: docs
# teacher/ queda fuera de docs_dir a propósito. Ver teacher/README.md.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          # sin fallback: si falta el español, el build falla. Es deliberado.
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs"]   # ACOTADO. Nunca la raíz: dejaría inyectar teacher/.
  - toc:
      permalink: true

nav:
  - Home: index.md

# Mermaid se renderiza en cliente vía superfences. Se evita a propósito el
# plugin mermaid2: valida la URL de la librería en tiempo de build, lo que hace
# que `mkdocs build --strict` dependa de la red.
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.esm.min.mjs
