site_name: Apuntes CFGS ASIR
site_url: https://jauselmor.github.io/asir-handbook/
site_author: Jaime Selva
repo_url: https://github.com/jauselmor/asir-handbook
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

plugins:
  # i18n MUST come first: it rewrites the file set every other plugin sees.
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          site_name: Apuntes CFGS ASIR
          theme:
            language: es
          nav_translations:
            Home: Inicio
            Networks: Redes
            Markup languages: Lenguajes de marcas
            Common: Común
            Showcase: Muestra de formato
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - mermaid2
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version:
    provider: mike
    alias: true

nav:
  - Home: index.md
  - Networks:
      - redes/index.md
      - VLANs: redes/vlan.md
  - Markup languages:
      - marcas/index.md
      - XML: marcas/xml.md
  - Common:
      - comun/index.md
  - Showcase: showcase.md
